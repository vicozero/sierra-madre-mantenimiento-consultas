name: Publicar portal de consulta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener contenido del repositorio
        uses: actions/checkout@v6
      - name: Validar archivos del portal
        run: test -s index.html && test -s app.js && test -s styles.css && test -s data/demo.json
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Cargar sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
